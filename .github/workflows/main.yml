name: CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  push_to_registry:
    name: Build & Push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/tgifts
          tags: |
            latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          no-cache: true
          build-args: |
            GIT_TOKEN=${{ secrets.GIT_TOKEN }}
            CERT_PEM_B64=${{ secrets.BACKEND_CERT }}
            KEY_PEM_B64=${{ secrets.BACKEND_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  server_update:
    name: Deploy to server via SSH
    needs: push_to_registry
    runs-on: ubuntu-latest

    steps:
      - name: Run remote deploy script
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SERVER_CERT }}
          script_stop: true
          script: bash /home/devops/TGifts/deploy.sh
